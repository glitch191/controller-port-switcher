# Builds the binaries and attaches them to a GitHub release when a version tag
# (for example v0.2.0) is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/release/controller-port-switcher.exe
            target/release/xinput-probe.exe
